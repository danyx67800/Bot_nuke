version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bot-nuke_server_1
      APP_PORT: 4321

  server:
    image: ghcr.io/danyx67800/bot-nuke:1.0.0
    restart: on-failure
    stop_grace_period: 15s
    environment:
      PORT: "4321"
      DATA_DIR: /data
      TZ: Europe/Rome
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
