manifestVersion: 1.1
id: bot-nuke
category: social
name: Bot Nuke
version: "1.0.0"
tagline: Caos controllato per il tuo evento Discord
description: >-
  Bot Nuke fa animare il server durante l'evento: cambia in loop i nomi dei canali,
  ne rimescola l'ordine e ripete in chat i messaggi che decidi tu.


  Tutto si comanda da una dashboard web con configurazione guidata in sei passi:
  token del bot, server, canali, nomi e ordine, messaggi e tempi. C'è anche un
  pulsante Panic che ferma il loop e rimette i nomi originali.


  Il comportamento rispetta i limiti di Discord: le rinomine vengono messe in coda
  (massimo 2 per canale ogni 10 minuti) e i messaggi sono spalmati automaticamente,
  così il bot non viene rate-limitato.
